<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Grupo de Ofertas | Supermercado Paineiras</title>

  <meta
    name="description"
    content="Entre no grupo de ofertas do Supermercado Paineiras no WhatsApp."
  >

  <meta name="theme-color" content="#e31e2f">


  <!--
  ==========================================
  META PIXEL

  Depois adicionaremos aqui o Meta Pixel.
  O clique no WhatsApp já está preparado.
  ==========================================
  -->


  <style>

    :root {
      --red: #e31e2f;
      --red-dark: #bd1220;
      --yellow: #ffd83d;
      --green: #20bd5a;
      --white: #ffffff;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {

      min-height: 100dvh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f2f2f2;

      color: var(--white);

    }


    /* =========================================
       PÁGINA
    ========================================= */


    .page {

      position: relative;

      width: min(100%, 480px);

      min-height: 100dvh;

      margin: 0 auto;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      text-align: center;

      overflow: hidden;


      background:

        radial-gradient(
          circle at 50% 5%,
          rgba(255,255,255,.18),
          transparent 28%
        ),

        linear-gradient(
          160deg,
          #f22c3c 0%,
          var(--red) 48%,
          var(--red-dark) 100%
        );


      box-shadow:
        0 0 50px rgba(0,0,0,.12);

    }


    .page::before,
    .page::after {

      content: "";

      position: absolute;

      border-radius: 50%;

      background:
        rgba(255,255,255,.06);

      pointer-events: none;

    }


    .page::before {

      width: 280px;

      height: 280px;

      top: -160px;

      right: -130px;

    }


    .page::after {

      width: 230px;

      height: 230px;

      left: -150px;

      bottom: -60px;

    }


    /* =========================================
       CONTEÚDO
    ========================================= */


    .content {

      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 390px;

      margin: 0 auto;

    }


    /* =========================================
       LOGO
    ========================================= */


    .brand {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin-bottom: 20px;

    }


    .brand-logo {

      width: 58px;

      height: 58px;

      object-fit: contain;

      flex-shrink: 0;

    }


    .brand-name {

      text-align: left;

      text-transform: uppercase;

      line-height: .95;

    }


    .brand-name span {

      display: block;

      margin-bottom: 4px;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 2.3px;

      opacity: .82;

    }


    .brand-name strong {

      display: block;

      font-size: 23px;

      font-weight: 900;

      letter-spacing: -.5px;

    }


    /* =========================================
       TAG
    ========================================= */


    .tag {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 7px 12px;

      border:
        1px solid
        rgba(255,255,255,.22);

      border-radius: 999px;

      background:
        rgba(255,255,255,.11);

      font-size: 11px;

      font-weight: 850;

      letter-spacing: .6px;

      text-transform: uppercase;

    }


    /* =========================================
       TÍTULO
    ========================================= */


    h1 {

      margin:
        14px
        auto
        9px;

      max-width: 360px;

      font-size:
        clamp(
          31px,
          8.5vw,
          42px
        );

      line-height: 1;

      letter-spacing: -1.5px;

    }


    h1 span {

      color:
        var(--yellow);

    }


    /* =========================================
       SUBTÍTULO
    ========================================= */


    .subtitle {

      max-width: 345px;

      margin:
        0
        auto
        19px;

      color:
        rgba(255,255,255,.9);

      font-size: 15px;

      line-height: 1.4;

    }


    /* =========================================
       CARROSSEL
    ========================================= */


    .carousel {

      position: relative;

      width: 100%;

      margin: 0 auto;

    }


    .carousel-window {

      position: relative;

      width: 100%;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 20px;

      background: white;

      box-shadow:
        0 15px 35px
        rgba(0,0,0,.20);

    }


    .carousel-track {

      height: 100%;

      display: flex;

      transition:
        transform .45s
        cubic-bezier(.22,.61,.36,1);

    }


    .slide {

      min-width: 100%;

      height: 100%;

    }


    .slide img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

      user-select: none;

      -webkit-user-drag: none;

    }


    /* =========================================
       SETAS
    ========================================= */


    .carousel-arrow {

      position: absolute;

      z-index: 5;

      top: 50%;

      transform:
        translateY(-50%);

      width: 38px;

      height: 38px;

      display: grid;

      place-items: center;

      border: 0;

      border-radius: 50%;

      background:
        rgba(0,0,0,.40);

      color: white;

      font-size: 24px;

      cursor: pointer;

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);

    }


    .carousel-arrow.prev {

      left: 9px;

    }


    .carousel-arrow.next {

      right: 9px;

    }


    .carousel-arrow:active {

      transform:
        translateY(-50%)
        scale(.92);

    }


    /* =========================================
       BOLINHAS
    ========================================= */


    .carousel-dots {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 7px;

      margin-top: 12px;

    }


    .dot {

      width: 7px;

      height: 7px;

      padding: 0;

      border: 0;

      border-radius: 999px;

      background:
        rgba(255,255,255,.40);

      cursor: pointer;

      transition:
        all .25s ease;

    }


    .dot.active {

      width: 22px;

      background:
        white;

    }


    /* =========================================
       BOTÃO
    ========================================= */


    .cta {

      width: 100%;

      min-height: 66px;

      margin-top: 20px;

      padding: 17px 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      border-radius: 18px;


      background:

        linear-gradient(
          180deg,
          #29ca68 0%,
          var(--green) 100%
        );


      color: white;

      text-decoration: none;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: -.2px;


      box-shadow:

        0 14px 30px
        rgba(0,0,0,.18),

        inset 0 -4px 0
        rgba(0,0,0,.10);


      transition:
        transform .15s ease,
        box-shadow .15s ease;

      -webkit-tap-highlight-color:
        transparent;

    }


    .cta:active {

      transform:
        scale(.98);

    }


    .whatsapp-icon {

      width: 29px;

      height: 29px;

      flex: 0 0 auto;

    }


    /* =========================================
       TEXTO FINAL
    ========================================= */


    .note {

      margin:
        11px
        0
        0;

      font-size: 12px;

      color:
        rgba(255,255,255,.73);

    }


    /* =========================================
       DESKTOP
    ========================================= */


    @media (min-width: 481px) {


      body {

        padding:
          20px 0;

      }


      .page {

        min-height:
          calc(100dvh - 40px);

        border-radius:
          28px;

      }


    }


  </style>

</head>



<body>


  <main class="page">


    <div class="content">


      <!-- =====================================
           LOGO
      ====================================== -->


      <div class="brand">


        <img
          src="logo.png"
          alt="Logo do Supermercado Paineiras"
          class="brand-logo"
        >


        <div class="brand-name">

          <span>
            Supermercado
          </span>

          <strong>
            Paineiras
          </strong>

        </div>


      </div>



      <!-- =====================================
           GRUPO
      ====================================== -->


      <div class="tag">

        🔥 Grupo de ofertas

      </div>



      <!-- =====================================
           CHAMADA
      ====================================== -->


      <h1>

        Ofertas direto no seu

        <span>
          WhatsApp!
        </span>

      </h1>



      <p class="subtitle">

        Confira algumas promoções e entre no nosso
        grupo para acompanhar as próximas ofertas.

      </p>



      <!-- =====================================
           CARROSSEL
      ====================================== -->


      <div
        class="carousel"
        id="promo-carousel"
      >


        <div
          class="carousel-window"
          id="carousel-window"
        >


          <div
            class="carousel-track"
            id="carousel-track"
          >


            <!-- PROMO 1 -->

            <div class="slide">

              <img
                src="promo1.png"
                alt="Promoção 1 do Supermercado Paineiras"
              >

            </div>


            <!-- PROMO 2 -->

            <div class="slide">

              <img
                src="promo2.png"
                alt="Promoção 2 do Supermercado Paineiras"
              >

            </div>


            <!-- PROMO 3 -->

            <div class="slide">

              <img
                src="promo3.png"
                alt="Promoção 3 do Supermercado Paineiras"
              >

            </div>


            <!-- PROMO 4 -->

            <div class="slide">

              <img
                src="promo4.png"
                alt="Promoção 4 do Supermercado Paineiras"
              >

            </div>


            <!-- PROMO 5 -->

            <div class="slide">

              <img
                src="promo5.png"
                alt="Promoção 5 do Supermercado Paineiras"
              >

            </div>


            <!-- PROMO 6 -->

            <div class="slide">

              <img
                src="promo6.png"
                alt="Promoção 6 do Supermercado Paineiras"
              >

            </div>


          </div>



          <!-- SETA ESQUERDA -->

          <button
            class="carousel-arrow prev"
            id="carousel-prev"
            type="button"
            aria-label="Promoção anterior"
          >

            ‹

          </button>



          <!-- SETA DIREITA -->

          <button
            class="carousel-arrow next"
            id="carousel-next"
            type="button"
            aria-label="Próxima promoção"
          >

            ›

          </button>


        </div>



        <!-- BOLINHAS -->

        <div
          class="carousel-dots"
          id="carousel-dots"
        ></div>


      </div>



      <!-- =====================================
           BOTÃO WHATSAPP
      ====================================== -->


      <a

        id="whatsapp-button"

        class="cta"

        href="https://chat.whatsapp.com/DdbEySF0wq5I4gynSdXYmL"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Entrar no grupo de ofertas do Supermercado Paineiras no WhatsApp"

      >


        <svg
          class="whatsapp-icon"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >

          <path
            fill="currentColor"
            d="M16.02 3.2A12.73 12.73 0 0 0 5.25 22.7L3.2 28.8l6.29-2.01a12.77 12.77 0 1 0 6.53-23.59Zm0 23.21c-2.03 0-4.01-.58-5.72-1.68l-.41-.25-3.73 1.19 1.22-3.63-.27-.43a10.48 10.48 0 1 1 8.91 4.8Zm5.75-7.85c-.32-.16-1.87-.92-2.16-1.03-.29-.1-.5-.16-.71.16-.21.31-.81 1.02-.99 1.23-.18.21-.37.24-.68.08-.32-.16-1.33-.49-2.54-1.57-.94-.84-1.57-1.87-1.75-2.19-.18-.31-.02-.48.14-.64.14-.14.32-.37.47-.55.16-.18.21-.31.32-.52.1-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.54-.71-.55h-.61c-.21 0-.55.08-.84.39-.29.32-1.1 1.08-1.1 2.63 0 1.55 1.13 3.05 1.29 3.26.16.21 2.22 3.39 5.38 4.75.75.32 1.34.52 1.8.67.76.24 1.45.21 1.99.13.61-.09 1.87-.76 2.13-1.5.26-.74.26-1.37.18-1.5-.08-.13-.29-.21-.61-.37Z"
          />

        </svg>


        ENTRAR NO GRUPO DE OFERTAS


      </a>



      <p class="note">

        É grátis. Toque no botão para entrar.

      </p>


    </div>


  </main>



  <script>


    /* =========================================
       CARROSSEL
    ========================================= */


    const track =
      document.getElementById(
        "carousel-track"
      );


    const slides =
      Array.from(
        track.children
      );


    const prevButton =
      document.getElementById(
        "carousel-prev"
      );


    const nextButton =
      document.getElementById(
        "carousel-next"
      );


    const dotsContainer =
      document.getElementById(
        "carousel-dots"
      );


    const carouselWindow =
      document.getElementById(
        "carousel-window"
      );


    let currentSlide = 0;

    let autoPlay;



    /* =========================================
       CRIAR BOLINHAS
    ========================================= */


    slides.forEach(
      function(slide, index) {


        const dot =
          document.createElement(
            "button"
          );


        dot.classList.add(
          "dot"
        );


        dot.type =
          "button";


        dot.setAttribute(
          "aria-label",
          "Ver promoção " + (index + 1)
        );


        dot.addEventListener(
          "click",
          function() {


            goToSlide(
              index
            );


            restartAutoPlay();


          }
        );


        dotsContainer.appendChild(
          dot
        );


      }
    );


    const dots =
      Array.from(
        dotsContainer.children
      );



    /* =========================================
       IR PARA SLIDE
    ========================================= */


    function goToSlide(index) {


      if (
        index < 0
      ) {

        index =
          slides.length - 1;

      }


      if (
        index >= slides.length
      ) {

        index = 0;

      }


      currentSlide =
        index;


      track.style.transform =
        "translateX(-" +
        (currentSlide * 100) +
        "%)";


      dots.forEach(
        function(dot) {

          dot.classList.remove(
            "active"
          );

        }
      );


      if (
        dots[currentSlide]
      ) {

        dots[currentSlide]
          .classList
          .add(
            "active"
          );

      }


    }



    /* =========================================
       SETAS
    ========================================= */


    prevButton.addEventListener(
      "click",
      function() {


        goToSlide(
          currentSlide - 1
        );


        restartAutoPlay();


      }
    );


    nextButton.addEventListener(
      "click",
      function() {


        goToSlide(
          currentSlide + 1
        );


        restartAutoPlay();


      }
    );



    /* =========================================
       AUTOPLAY
    ========================================= */


    function startAutoPlay() {


      autoPlay =
        setInterval(
          function() {


            goToSlide(
              currentSlide + 1
            );


          },
          4500
        );


    }



    function restartAutoPlay() {


      clearInterval(
        autoPlay
      );


      startAutoPlay();


    }



    /* =========================================
       SWIPE NO CELULAR
    ========================================= */


    let touchStartX = 0;

    let touchEndX = 0;



    carouselWindow.addEventListener(
      "touchstart",
      function(event) {


        touchStartX =
          event.changedTouches[0]
          .screenX;


      },
      {
        passive: true
      }
    );



    carouselWindow.addEventListener(
      "touchend",
      function(event) {


        touchEndX =
          event.changedTouches[0]
          .screenX;


        handleSwipe();


      },
      {
        passive: true
      }
    );



    function handleSwipe() {


      const swipeDistance =
        touchEndX -
        touchStartX;


      if (
        Math.abs(
          swipeDistance
        ) < 45
      ) {

        return;

      }


      if (
        swipeDistance < 0
      ) {


        goToSlide(
          currentSlide + 1
        );


      }
      else {


        goToSlide(
          currentSlide - 1
        );


      }


      restartAutoPlay();


    }



    /* =========================================
       INICIAR
    ========================================= */


    goToSlide(0);

    startAutoPlay();



    /* =========================================
       META PIXEL
    ========================================= */


    document
      .getElementById(
        "whatsapp-button"
      )
      .addEventListener(
        "click",
        function() {


          if (
            typeof fbq ===
            "function"
          ) {


            fbq(
              "trackCustom",
              "CliqueWhatsApp"
            );


          }


        }
      );


  </script>


</body>

</html>
