<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>
    Grupo de Ofertas | Supermercado Paineiras
  </title>

  <meta
    name="description"
    content="Entre no grupo de ofertas do Supermercado Paineiras no WhatsApp."
  >

  <meta
    name="theme-color"
    content="#e31e2f"
  >


  <!--
  ========================================
  META PIXEL

  Depois vamos adicionar aqui
  o código do Meta Pixel.
  ========================================
  -->


  <style>

    :root {

      --red: #e31e2f;

      --red-dark: #bd1220;

      --yellow: #ffd83d;

      --green: #20bd5a;

      --white: #ffffff;

    }



    * {

      box-sizing: border-box;

    }



    html,
    body {

      margin: 0;

      min-height: 100%;

    }



    body {

      min-height: 100dvh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f2f2f2;

      color: var(--white);

    }



    /* ========================================
       PÁGINA
    ======================================== */


    .page {

      position: relative;

      width: min(100%, 480px);

      min-height: 100dvh;

      margin: 0 auto;


      padding:

        max(
          30px,
          env(safe-area-inset-top)
        )

        24px

        max(
          28px,
          env(safe-area-inset-bottom)
        );


      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;


      text-align: center;


      overflow: hidden;


      background:

        radial-gradient(

          circle at 50% 5%,

          rgba(255,255,255,.18),

          transparent 28%

        ),

        linear-gradient(

          160deg,

          #f22c3c 0%,

          var(--red) 48%,

          var(--red-dark) 100%

        );


      box-shadow:

        0 0 50px
        rgba(0,0,0,.12);

    }



    /* ========================================
       DECORAÇÃO DO FUNDO
    ======================================== */


    .page::before,
    .page::after {

      content: "";

      position: absolute;

      border-radius: 50%;

      background:
        rgba(255,255,255,.06);

      pointer-events: none;

    }



    .page::before {

      width: 280px;

      height: 280px;

      top: -160px;

      right: -130px;

    }



    .page::after {

      width: 230px;

      height: 230px;

      left: -150px;

      bottom: -60px;

    }



    /* ========================================
       CONTEÚDO
    ======================================== */


    .content {

      position: relative;

      z-index: 1;


      width: 100%;

      max-width: 390px;

    }



    /* ========================================
       MARCA / LOGO
    ======================================== */


    .brand {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;


      margin-bottom: 34px;

    }



    /*
    Logo verdadeira
    */


    .brand-logo {

      width: 58px;

      height: 58px;

      object-fit: contain;

      flex-shrink: 0;

    }



    /*
    Nome do supermercado
    */


    .brand-name {

      text-align: left;

      text-transform: uppercase;

      line-height: .95;

    }



    .brand-name span {

      display: block;

      margin-bottom: 4px;


      font-size: 10px;

      font-weight: 800;

      letter-spacing: 2.3px;


      opacity: .82;

    }



    .brand-name strong {

      display: block;


      font-size: 23px;

      font-weight: 900;

      letter-spacing: -.5px;

    }



    /* ========================================
       GRUPO DE OFERTAS
    ======================================== */


    .tag {

      display: inline-flex;

      align-items: center;

      gap: 6px;


      padding:

        8px
        13px;


      border:

        1px solid
        rgba(255,255,255,.22);


      border-radius: 999px;


      background:

        rgba(255,255,255,.11);


      font-size: 12px;

      font-weight: 850;

      letter-spacing: .6px;

      text-transform: uppercase;

    }



    /* ========================================
       TÍTULO
    ======================================== */


    h1 {

      margin:

        17px
        auto
        13px;


      max-width: 360px;


      font-size:

        clamp(
          36px,
          10vw,
          48px
        );


      line-height: .98;


      letter-spacing: -1.8px;

    }



    h1 span {

      color:
        var(--yellow);

    }



    /* ========================================
       SUBTÍTULO
    ======================================== */


    .subtitle {

      max-width: 345px;


      margin:

        0
        auto;


      color:

        rgba(
          255,
          255,
          255,
          .90
        );


      font-size: 17px;


      line-height: 1.45;

    }



    /* ========================================
       BOTÃO WHATSAPP
    ======================================== */


    .cta {

      width: 100%;


      min-height: 68px;


      margin-top: 30px;


      padding:

        18px
        18px;


      display: flex;


      align-items: center;


      justify-content: center;


      gap: 11px;


      border-radius: 18px;


      background:

        linear-gradient(

          180deg,

          #29ca68 0%,

          var(--green) 100%

        );


      color: white;


      text-decoration: none;


      font-size: 17px;


      font-weight: 900;


      letter-spacing: -.2px;


      box-shadow:

        0 14px 30px
        rgba(0,0,0,.18),

        inset 0 -4px 0
        rgba(0,0,0,.10);


      transition:

        transform .15s ease,

        box-shadow .15s ease;


      -webkit-tap-highlight-color:

        transparent;

    }



    .cta:active {

      transform:

        scale(.98);


      box-shadow:

        0 8px 18px
        rgba(0,0,0,.15),

        inset 0 -3px 0
        rgba(0,0,0,.10);

    }



    /* ========================================
       ÍCONE WHATSAPP
    ======================================== */


    .whatsapp-icon {

      width: 30px;

      height: 30px;

      flex: 0 0 auto;

    }



    /* ========================================
       TEXTO ABAIXO DO BOTÃO
    ======================================== */


    .note {

      margin:

        13px
        0
        0;


      font-size: 12px;


      color:

        rgba(
          255,
          255,
          255,
          .73
        );

    }



    /* ========================================
       CELULARES COM TELA BAIXA
    ======================================== */


    @media (max-height: 620px) {


      .brand {

        margin-bottom: 22px;

      }


      .brand-logo {

        width: 50px;

        height: 50px;

      }


      h1 {

        font-size: 35px;

      }


      .cta {

        margin-top: 22px;

      }


    }



    /* ========================================
       DESKTOP
    ======================================== */


    @media (min-width: 481px) {


      body {

        padding: 20px 0;

      }


      .page {

        min-height:

          calc(
            100dvh - 40px
          );


        border-radius: 28px;

      }


    }


  </style>

</head>



<body>



  <main class="page">



    <div class="content">



      <!-- =====================================
           LOGO + NOME
      ====================================== -->


      <div class="brand">


        <img

          src="logo.png"

          alt="Logo do Supermercado Paineiras"

          class="brand-logo"

        >



        <div class="brand-name">


          <span>

            Supermercado

          </span>


          <strong>

            Paineiras

          </strong>


        </div>


      </div>



      <!-- =====================================
           GRUPO DE OFERTAS
      ====================================== -->


      <div class="tag">

        🔥 Grupo de ofertas

      </div>



      <!-- =====================================
           CTA
      ====================================== -->


      <h1>

        Ofertas direto no seu

        <span>

          WhatsApp!

        </span>

      </h1>



      <!-- =====================================
           TEXTO
      ====================================== -->


      <p class="subtitle">

        Entre no grupo do Supermercado Paineiras
        e acompanhe nossas promoções.

      </p>



      <!-- =====================================
           BOTÃO WHATSAPP
      ====================================== -->


      <a

        id="whatsapp-button"

        class="cta"

        href="https://chat.whatsapp.com/DdbEySF0wq5I4gynSdXYmL"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Entrar no grupo de ofertas do Supermercado Paineiras no WhatsApp"

      >



        <svg

          class="whatsapp-icon"

          viewBox="0 0 32 32"

          aria-hidden="true"

        >


          <path

            fill="currentColor"

            d="M16.02 3.2A12.73 12.73 0 0 0 5.25 22.7L3.2 28.8l6.29-2.01a12.77 12.77 0 1 0 6.53-23.59Zm0 23.21c-2.03 0-4.01-.58-5.72-1.68l-.41-.25-3.73 1.19 1.22-3.63-.27-.43a10.48 10.48 0 1 1 8.91 4.8Zm5.75-7.85c-.32-.16-1.87-.92-2.16-1.03-.29-.1-.5-.16-.71.16-.21.31-.81 1.02-.99 1.23-.18.21-.37.24-.68.08-.32-.16-1.33-.49-2.54-1.57-.94-.84-1.57-1.87-1.75-2.19-.18-.31-.02-.48.14-.64.14-.14.32-.37.47-.55.16-.18.21-.31.32-.52.1-.21.05-.39-.03-.55-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.54-.71-.55h-.61c-.21 0-.55.08-.84.39-.29.32-1.1 1.08-1.1 2.63 0 1.55 1.13 3.05 1.29 3.26.16.21 2.22 3.39 5.38 4.75.75.32 1.34.52 1.8.67.76.24 1.45.21 1.99.13.61-.09 1.87-.76 2.13-1.5.26-.74.26-1.37.18-1.5-.08-.13-.29-.21-.61-.37Z"

          />


        </svg>



        ENTRAR NO GRUPO DE OFERTAS



      </a>



      <!-- =====================================
           TEXTO FINAL
      ====================================== -->


      <p class="note">

        É grátis. Toque no botão para entrar.

      </p>



    </div>



  </main>



  <!-- =========================================
       RASTREAMENTO DO CLIQUE
  ========================================== -->


  <script>


    document

      .getElementById(
        "whatsapp-button"
      )

      .addEventListener(

        "click",

        function () {


          if (

            typeof fbq === "function"

          ) {


            fbq(

              "trackCustom",

              "CliqueWhatsApp"

            );


          }


        }

      );


  </script>



</body>

</html>
